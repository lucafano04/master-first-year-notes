name: Compile LaTeX Notes & Publish

on:
  push:
    branches:
      - main
  workflow_dispatch: # Consente l'esecuzione manuale

jobs:
  build:
    name: Compile Subtrees
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - folder: 'CCC'
            tex_file: 'main.tex'
            pdf_name: 'Notes_CCC.pdf'
          - folder: 'security-testing'
            tex_file: 'main.tex'
            pdf_name: 'Notes_Security_Testing.pdf'
          - folder: 'Advanced Computing Architecture'
            tex_file: 'main.tex'
            pdf_name: 'Notes_Advanced_Computing_Architectures.pdf'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile LaTeX Document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ${{ matrix.tex_file }}
          working_directory: ${{ matrix.folder }}
          args: "-pdf -interaction=nonstopmode -halt-on-error"

      # Rename main.pdf to the unique course PDF name before uploading
      - name: Rename Output PDF
        run: |
          mv "${{ matrix.folder }}/main.pdf" "${{ matrix.pdf_name }}"

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pdf_name }}
          path: ${{ matrix.pdf_name }}

  release:
    name: Publish Latest Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all artifacts into single folder
        uses: actions/download-artifact@v4
        with:
          path: pdfs/
          merge-multiple: true

      - name: Move 'latest' Tag to Current Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Delete the remote 'latest' tag if it exists
          git push origin --delete latest || true
          
          # Create/force tag 'latest' locally at the current HEAD
          git tag -f latest
          
          # Push the updated 'latest' tag to remote
          git push origin latest --force

      - name: Update 'latest' Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Compiled Notes"
          body: "This release contains the latest compiled notes from the repository."
          prerelease: false
          files: pdfs/*.pdf
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}